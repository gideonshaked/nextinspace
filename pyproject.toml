[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8"
]

[project]
name = "nextinspace"
version = "4.0.0"
description = "Never miss a launch."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{name = "Gideon Shaked", email = "gideonshaked@gmail.com"}]
maintainers = [{name = "Gideon Shaked", email = "gideonshaked@gmail.com"}]
requires-python = ">=3.11"
keywords = ["space", "nextinspace", "space news", "spaceflight", "rockets", "launches", "cli", "tui"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Natural Language :: English",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Astronomy"
]
dependencies = [
  "httpx>=0.27",
  "platformdirs>=4.0",
  "rich>=13.7",
  "textual>=1.0",
  "typer>=0.12",
  "tzdata>=2024.1; sys_platform == 'win32'"
]

[project.scripts]
nextinspace = "nextinspace.cli:main"

[project.urls]
Homepage = "https://github.com/gideonshaked/nextinspace"
Issues = "https://github.com/gideonshaked/nextinspace/issues"
Repository = "https://github.com/gideonshaked/nextinspace"

[tool.mypy]
files = ["src"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
